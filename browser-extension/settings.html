<!doctype html>
<html lang="zh-CN" class="wa-light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>设置 · 大懒虫</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="settings.css"><link rel="stylesheet" href="license-ui.css"></head>
<body data-license-locked><section id="license-gate" aria-label="插件激活"><h1>激活大懒虫</h1><p role="status">正在读取授权状态…</p></section>
<main class="settings"><header><img src="assets/logo.png" alt=""><h1>设置</h1><span id="version"></span></header>
<section class="setting-section"><h2>授权状态</h2><div class="setting-row"><strong id="license-state">读取中…</strong><button id="verify-license" class="btn outline" type="button">重新验证</button></div><p id="expires"></p></section>
<form id="settings-form" class="setting-section"><h2>网页店铺标识</h2><label for="shop-name">店铺名称</label><input id="shop-name" maxlength="40" autocomplete="off"><label class="toggle"><input id="show-shop-name" type="checkbox">在网页显示店铺名称</label><button class="btn primary" type="submit">保存设置</button></form>
<p id="settings-status" role="status" aria-live="polite"></p></main><script type="module" src="settings.js"></script></body></html>
